name: CI Colors App

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: mysql -h 127.0.0.1 -uroot -proot < LAMPAPI/testSchema.sql

      - name: Start PHP server
        run: DB_HOST=127.0.0.1 DB_NAME=COP4331_TEST DB_USER=TheBeast DB_PASS=WeLoveCOP4331 php -S 127.0.0.1:8000 -t . &

      - name: Wait for PHP server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/public/index.html; then
              exit 0
            fi
            sleep 1
          done
          echo "PHP server did not become ready in time."
          exit 1

      - name: Run tests
        run: npm test
